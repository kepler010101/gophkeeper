name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: gophkeeper
          POSTGRES_USER: gophkeeper
          POSTGRES_PASSWORD: gophkeeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gophkeeper"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      GOPHKEEPER_TEST_DB: postgres://gophkeeper:gophkeeper@localhost:5432/gophkeeper?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: go test ./... -coverprofile=coverage.out -coverpkg=./...
      - run: |
          total=$(go tool cover -func=coverage.out | awk '/total:/ {gsub("%","",$3); print $3}')
          if awk "BEGIN {exit !($total >= 80)}"; then echo "coverage ok: $total%"; else echo "coverage too low: $total%"; exit 1; fi
